name: Validate rules
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate catalog and ownership
        run: python3 scripts/check.py
      - name: Check validator behavior
        run: python3 -m unittest discover -s tests -v
      - name: Verify example is current
        run: |
          python3 scripts/render.py --service Netflix=SG --service Disney=SG --service AI=AI > /tmp/proxy-unlock-example.yml
          diff -u examples/defined.yml /tmp/proxy-unlock-example.yml
